[package]
name = "taria-mcp"
description = "MCP bridge for taria. Exposes any taria-enabled TUI app to AI agent harnesses (Claude Code, OpenCode, Cursor) as MCP tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
taria.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp = { version = "3", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "io-util", "time"] }
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "taria-mcp"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
