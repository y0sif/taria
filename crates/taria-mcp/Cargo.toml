[package]
name = "taria-mcp"
description = "MCP bridge for taria. Exposes any taria-enabled TUI app to AI agent harnesses (Claude Code, OpenCode, Cursor) as MCP tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
taria.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
rmcp = { version = "3.8", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "io-util", "time"] }
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "taria-mcp"
path = "src/main.rs"

[dev-dependencies]
taria-ratatui = { path = "../taria-ratatui" }
tempfile = "3.27.0"
tokio = { version = "1", features = ["test-util", "rt-multi-thread"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }
