[package]
name = "taria-ratatui"
description = "Ratatui adapter for taria. Publishes your app's widget tree, focus, and actions to AI agents alongside normal rendering."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
# Default features off on purpose. This adapter uses the crossterm event types,
# `Buffer`, `Rect` and `Widget`, and has no business widening the host app's
# ratatui. Cargo unions features, so taking the defaults here would turn them
# back on in an app that trimmed its own, undoing its choice and building the
# calendar widget and the crates behind the other defaults into it. Terminal
# output is unaffected: `underline-color` comes from `ratatui-crossterm`'s own
# defaults, so a crossterm host has it regardless.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde_json.workspace = true
taria.workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }
