[package]
name = "taria"
description = "Agent accessibility layer for terminal user interfaces. Lets TUI apps expose their widget tree, focus state, and available actions to AI agents, like ARIA does for the web."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
serde.workspace = true

# Only the tests serialize anything here: the crate defines the wire types and
# leaves the encoding to whoever transports them, so adopters do not inherit a
# JSON dependency from the core crate.
[dev-dependencies]
serde_json.workspace = true
