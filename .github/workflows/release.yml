name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # taria-mcp is the only artifact a user installs: the adapter and the
      # core crate are dependencies an app builds against, and the demo is
      # not published at all.
      - name: Build
        run: cargo build --release --locked -p taria-mcp --target ${{ matrix.target }}
      # Both licences travel with the binary, since the dual licence is the
      # offer being made to whoever redistributes it.
      - name: Package
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p staging
          cp target/${{ matrix.target }}/release/taria-mcp staging/
          cp README.md LICENSE-MIT LICENSE-APACHE staging/
          cd staging
          tar czf ../taria-mcp-${{ matrix.target }}.tar.gz *
          cd ..
          shasum -a 256 taria-mcp-${{ matrix.target }}.tar.gz > taria-mcp-${{ matrix.target }}.tar.gz.sha256
      # A zip, which Windows opens without extra tools, beside a checksum file
      # in shasum's own format (`<hash>  <name>`, then a newline), so
      # `sha256sum -c` reads it as it reads the tarballs' ones.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "taria-mcp-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item target/${{ matrix.target }}/release/taria-mcp.exe staging/
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE staging/
          Compress-Archive -Path staging/* -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          Set-Content -Path "$archive.sha256" -Value "$hash  $archive`n" -NoNewline -Encoding ascii
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: taria-mcp-${{ matrix.target }}
          path: |
            taria-mcp-${{ matrix.target }}.tar.gz*
            taria-mcp-${{ matrix.target }}.zip*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # Release notes are written by hand from CHANGELOG.md. This workflow
      # publishes binaries; the crates themselves go to crates.io from a
      # workstation, in dependency order, which is a decision rather than a
      # step and so stays off the automation.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
