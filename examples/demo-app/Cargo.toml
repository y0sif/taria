[package]
name = "taria-demo"
description = "Demo ratatui app used to show an agent driving a TUI through taria vs. fumbling through screen-scraping."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
# Trimmed the way a careful host trims it, so this workspace resolves ratatui
# as an adopter's app would. `cargo tree -e features -i ratatui -p taria-demo`
# shows whether the adapter widens it.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
taria.workspace = true
taria-ratatui = { path = "../../crates/taria-ratatui" }
